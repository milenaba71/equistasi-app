<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Primo – Assistente Equistasi</title>
  <meta name="description" content="Parla con Primo, l’assistente virtuale Equistasi per professionisti sanitari e preparatori atletici." />
  <meta name="theme-color" content="#29235C" />
  <link rel="icon" href="../equistasi-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="top">
    <img src="../equistasi-logo.png" alt="Equistasi" class="logo" />
    <span class="mode" id="mode"></span>
    <button class="profile-btn" id="btn-profile" type="button" hidden></button>
    <span class="spacer"></span>
    <label class="lang" title="Lingua">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      <select id="lang" aria-label="Lingua"></select>
    </label>
    <button class="icon-btn" id="btn-voice" type="button" aria-pressed="true" aria-label="Voce">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="mute" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button class="icon-btn" id="btn-new" type="button" aria-label="Nuova conversazione">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <main class="stage">
    <div class="halo" aria-hidden="true"></div>
    <div id="avatar" class="avatar" data-state="idle"></div>
    <div class="caption">
      <p class="subtitle" id="subtitle" aria-live="polite"></p>
      <div class="live-sources" id="live-sources"></div>
      <p class="status" id="status" aria-live="polite"></p>
    </div>
  </main>

  <div class="onboard" id="onboard" hidden></div>

  <form class="composer" id="composer" autocomplete="off" hidden>
    <textarea id="input" rows="1" aria-label="Messaggio"></textarea>
    <button class="send" id="btn-send" type="submit" aria-label="Invia">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5z" fill="currentColor"/></svg>
    </button>
  </form>

  <nav class="controls">
    <button class="side-btn" id="btn-keyboard" type="button">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 10h1M9.5 10h1M13 10h1M16.5 10h1M7 14h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span id="lbl-keyboard"></span>
    </button>
    <button class="talk" id="btn-talk" type="button">
      <svg class="ic-mic" viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="ic-stop" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></svg>
      <span id="lbl-talk"></span>
    </button>
    <button class="side-btn" id="btn-transcript" type="button">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M5 4h14v16H5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M8 9h8M8 13h8M8 17h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span id="lbl-transcript"></span>
    </button>
  </nav>
  <p class="disclaimer" id="disclaimer"></p>

  <dialog id="transcript-dlg" class="sheet">
    <div class="sheet-head"><b id="ttl-transcript"></b><button class="btn" id="btn-close-transcript" type="button"></button></div>
    <ol class="log" id="log"></ol>
  </dialog>

  <dialog id="source-dlg" class="source-dlg">
    <form method="dialog">
      <p class="src-cat" id="src-cat"></p>
      <h2 id="src-title"></h2>
      <p class="src-ref" id="src-ref"></p>
      <div class="src-text" id="src-text"></div>
      <p><a id="src-link" target="_blank" rel="noopener">DOI / link</a></p>
      <button class="btn" value="close">OK</button>
    </form>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/scan.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
